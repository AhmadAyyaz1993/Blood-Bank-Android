<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BloodBank">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/ic_launcher.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/ic_launcher.png"/>

  <title>BloodBank</title>
  <link rel="manifest" href="manifest.json">

  <script>
    const serviceWorkerVersion = '{{flutter_service_worker_version}}';
  </script>

  <!-- This script adds the Flutter initialization JS code -->
  <script src="flutter.js" defer></script>

  <style>
    /* Full-screen loader */
    #loading {
      position: fixed;
      width: 100%;
      height: 100%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    /* Spinner animation */
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid lightgray;
      border-top: 5px solid #d32f2f;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<!-- Custom Loading Screen -->
<div id="loading">
  <img src="icons/ic_launcher.png" width="150">
  <p>Loading BloodBank...</p>
</div>

<script>
  window.addEventListener('load', function () {
    if (typeof _flutter !== 'undefined' && _flutter.loader) {
      _flutter.loader.load({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
      }).then(function(engineInitializer) {
        return engineInitializer.initializeEngine();
      }).then(function(appRunner) {
        document.getElementById('loading').style.display = 'none'; // Hide loader when Flutter is ready
        appRunner.runApp();
      });
    }
  });
</script>

<script src="flutter_bootstrap.js" async></script>
</body>
</html>
